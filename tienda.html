<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tienda · perfumescyc</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50:'#f0fdfa',100:'#ccfbf1',200:'#99f6e4',300:'#5eead4',
              400:'#2dd4bf',500:'#14b8a6',600:'#0d9488',700:'#0f766e',
              800:'#115e59',900:'#134e4a',950:'#042f2e'
            }
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="min-h-screen bg-neutral-50 text-neutral-900 antialiased">

<!-- ============================================================
     CONFIG SUPABASE (mismo URL + publishable key que .env.local)
     ============================================================ -->
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

  const SUPABASE_URL  = "https://zcvpboxofdqlqouthble.supabase.co";
  const SUPABASE_ANON = "sb_publishable_J16sSUWfaigBlBuhcOAt6w_rVeVq5In";
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

  // -------- estado global mínimo --------
  const state = {
    categorias: [],
    productos: [],
    config: { whatsapp: "", nombre_tienda: "", instagram: "" },
    cart: JSON.parse(localStorage.getItem("cart") || "[]"),
  };

  // -------- helpers --------
  const $ = (sel) => document.querySelector(sel);
  const fmt = (n) => "$" + Number(n).toLocaleString("es-AR");

  function saveCart() {
    localStorage.setItem("cart", JSON.stringify(state.cart));
    renderCartBadge();
  }

  // PER- + 5 alfanuméricos uppercase
  function generarCodigo() {
    const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let s = "PER-";
    for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)];
    return s;
  }

  // -------- carga inicial --------
  async function load() {
    const [{ data: cats }, { data: prods }, { data: cfg }] = await Promise.all([
      sb.from("categorias").select("*").order("orden"),
      sb.from("productos").select("*").eq("visible", true).order("orden"),
      sb.from("config_tienda").select("*").eq("id", 1).single(),
    ]);
    state.categorias = cats || [];
    state.productos  = prods || [];
    state.config     = cfg || state.config;
    renderHeader();
    renderCatalogo();
    renderCartBadge();
  }

  // -------- render --------
  function renderHeader() {
    $("#brand").textContent = state.config.nombre_tienda || "Tienda";
    if (state.config.instagram) {
      $("#ig").href = "https://instagram.com/" + state.config.instagram.replace("@","");
      $("#ig").textContent = "@" + state.config.instagram.replace("@","");
    }
  }

  function renderCatalogo() {
    const root = $("#catalogo");
    root.innerHTML = "";
    state.categorias.forEach(cat => {
      const prods = state.productos.filter(p => p.categoria_id === cat.id);
      if (!prods.length) return;
      const section = document.createElement("section");
      section.className = "mb-10";
      section.innerHTML = `
        <h2 class="mb-3 text-xl font-semibold text-neutral-800">${cat.nombre}</h2>
        <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4"></div>`;
      const grid = section.querySelector("div");
      prods.forEach(p => {
        const img = (p.imagenes && p.imagenes[0]) || "";
        const sinStock = p.incluir_stock && (p.stock ?? 0) <= 0;
        const card = document.createElement("article");
        card.className = "overflow-hidden rounded-lg border border-neutral-200 bg-white";
        card.innerHTML = `
          <div class="aspect-square bg-neutral-100 ${img ? '' : 'flex items-center justify-center text-neutral-400 text-xs'}">
            ${img ? `<img src="${img}" alt="${p.nombre}" class="h-full w-full object-cover" loading="lazy" />` : 'sin imagen'}
          </div>
          <div class="p-3">
            <h3 class="text-sm font-medium leading-tight">${p.nombre}</h3>
            ${p.descripcion ? `<p class="mt-0.5 text-xs text-neutral-500 line-clamp-2">${p.descripcion}</p>` : ''}
            <p class="mt-2 font-semibold text-primary-700">${fmt(p.precio)}</p>
            ${sinStock
              ? `<button disabled class="mt-2 w-full rounded-md bg-neutral-200 px-2 py-1.5 text-xs text-neutral-500">Sin stock</button>`
              : `<button data-add="${p.id}" class="mt-2 w-full rounded-md bg-primary-600 px-2 py-1.5 text-xs font-medium text-white hover:bg-primary-700">Agregar</button>`}
          </div>`;
        grid.appendChild(card);
      });
      root.appendChild(section);
    });

    root.querySelectorAll("[data-add]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.add;
        const p = state.productos.find(x => x.id === id);
        const existing = state.cart.find(c => c.producto_id === id);
        if (existing) existing.cantidad += 1;
        else state.cart.push({
          producto_id: p.id,
          variante_id: null,
          nombre: p.nombre,
          precio_unitario: Number(p.precio),
          cantidad: 1
        });
        saveCart();
        renderCartDrawer();
        openDrawer();
      });
    });
  }

  function renderCartBadge() {
    const n = state.cart.reduce((s, x) => s + x.cantidad, 0);
    $("#cart-count").textContent = n;
    $("#cart-btn").classList.toggle("animate-pulse", n > 0);
  }

  function renderCartDrawer() {
    const list = $("#cart-list");
    list.innerHTML = "";
    if (!state.cart.length) {
      list.innerHTML = '<p class="text-sm text-neutral-500">Tu carrito está vacío.</p>';
      $("#cart-total").textContent = fmt(0);
      $("#cart-finalizar").disabled = true;
      $("#cart-finalizar").classList.add("opacity-50","cursor-not-allowed");
      return;
    }
    $("#cart-finalizar").disabled = false;
    $("#cart-finalizar").classList.remove("opacity-50","cursor-not-allowed");

    let total = 0;
    state.cart.forEach((item, idx) => {
      total += item.cantidad * item.precio_unitario;
      const row = document.createElement("div");
      row.className = "flex items-start gap-2 border-b border-neutral-100 py-2 last:border-0";
      row.innerHTML = `
        <div class="flex-1">
          <p class="text-sm font-medium">${item.nombre}</p>
          <p class="text-xs text-neutral-500">${fmt(item.precio_unitario)} c/u</p>
        </div>
        <div class="flex items-center gap-1">
          <button data-dec="${idx}" class="h-6 w-6 rounded border text-sm">−</button>
          <span class="w-6 text-center text-sm">${item.cantidad}</span>
          <button data-inc="${idx}" class="h-6 w-6 rounded border text-sm">+</button>
        </div>
        <button data-del="${idx}" class="text-xs text-red-600 hover:underline ml-2">×</button>`;
      list.appendChild(row);
    });
    $("#cart-total").textContent = fmt(total);

    list.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => { state.cart[+b.dataset.inc].cantidad++; saveCart(); renderCartDrawer(); });
    list.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => {
      const i = +b.dataset.dec;
      if (state.cart[i].cantidad > 1) state.cart[i].cantidad--;
      else state.cart.splice(i, 1);
      saveCart(); renderCartDrawer();
    });
    list.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      state.cart.splice(+b.dataset.del, 1); saveCart(); renderCartDrawer();
    });
  }

  function openDrawer()  { $("#drawer").classList.remove("translate-x-full"); $("#backdrop").classList.remove("hidden"); }
  function closeDrawer() { $("#drawer").classList.add("translate-x-full");    $("#backdrop").classList.add("hidden"); }

  // -------- checkout: finalizar por WhatsApp con persistencia --------
  async function finalizar(ev) {
    ev.preventDefault();
    const btn = $("#cart-finalizar");
    btn.disabled = true;
    btn.textContent = "Guardando pedido…";

    const form = $("#checkout-form");
    const data = Object.fromEntries(new FormData(form));

    if (!data.cliente_nombre?.trim() || !data.telefono?.trim()) {
      alert("Nombre y teléfono son obligatorios.");
      btn.disabled = false;
      btn.textContent = "Finalizar por WhatsApp";
      return;
    }
    if (!state.config.whatsapp) {
      alert("La tienda no tiene WhatsApp configurado. Avisale al admin.");
      btn.disabled = false;
      btn.textContent = "Finalizar por WhatsApp";
      return;
    }

    const items = state.cart.map(i => ({
      producto_id:     i.producto_id,
      variante_id:     i.variante_id,
      nombre:          i.nombre,
      cantidad:        i.cantidad,
      precio_unitario: i.precio_unitario,
    }));
    const total = items.reduce((s, i) => s + i.cantidad * i.precio_unitario, 0);

    // Reintentos por colisión de codigo (5 alfanum es ~60M combinaciones; muy improbable, pero handleamos)
    let pedido = null, lastErr = null;
    for (let attempt = 0; attempt < 5; attempt++) {
      const codigo = generarCodigo();
      const { data: ins, error } = await sb.from("pedidos").insert({
        codigo,
        estado: "pendiente",
        total,
        items,
        cliente_nombre: data.cliente_nombre.trim(),
        telefono:       data.telefono.trim(),
        metodo_entrega: data.metodo_entrega || null,
        direccion:      data.direccion?.trim() || null,
        vendedor:       data.vendedor || null,
      }).select("codigo").single();

      if (!error) { pedido = ins; break; }
      lastErr = error;
      // 23505 = unique_violation. Solo retry si el conflicto es por codigo.
      if (error.code !== "23505") break;
    }

    if (!pedido) {
      console.error(lastErr);
      alert("No pudimos guardar el pedido. Probá de nuevo.\n\n" + (lastErr?.message || ""));
      btn.disabled = false;
      btn.textContent = "Finalizar por WhatsApp";
      return;
    }

    // Mensaje WhatsApp
    const lineas = state.cart.map(i =>
      `• ${i.cantidad} × ${i.nombre} — ${fmt(i.precio_unitario * i.cantidad)}`
    );
    const msg = [
      `*Pedido ${pedido.codigo}*`,
      ``,
      `Cliente: ${data.cliente_nombre}`,
      `Tel: ${data.telefono}`,
      data.metodo_entrega ? `Entrega: ${data.metodo_entrega}` : null,
      data.direccion ? `Dirección: ${data.direccion}` : null,
      data.vendedor ? `Vendedor: ${data.vendedor}` : null,
      ``,
      `*Detalle:*`,
      ...lineas,
      ``,
      `*Total: ${fmt(total)}*`,
    ].filter(Boolean).join("\n");

    const url = `https://wa.me/${state.config.whatsapp.replace(/\D/g,"")}?text=${encodeURIComponent(msg)}`;

    // Limpiar carrito; el pedido ya está guardado
    state.cart = [];
    saveCart();
    renderCartDrawer();

    // Confirmar al usuario y abrir WhatsApp
    $("#cart-finalizar").textContent = `Pedido ${pedido.codigo} guardado ✓`;
    setTimeout(() => {
      window.open(url, "_blank");
      closeDrawer();
      btn.disabled = false;
      btn.textContent = "Finalizar por WhatsApp";
    }, 600);
  }

  // -------- wire up --------
  document.addEventListener("DOMContentLoaded", () => {
    $("#cart-btn").addEventListener("click", () => { renderCartDrawer(); openDrawer(); });
    $("#close-drawer").addEventListener("click", closeDrawer);
    $("#backdrop").addEventListener("click", closeDrawer);
    $("#checkout-form").addEventListener("submit", finalizar);
    load().catch(err => {
      console.error(err);
      $("#catalogo").innerHTML = `<p class="text-sm text-red-600">Error cargando catálogo: ${err.message}</p>`;
    });
  });
</script>

<!-- ===================== UI ===================== -->
<header class="sticky top-0 z-30 border-b border-neutral-200 bg-white">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 p-4">
    <div class="flex items-center gap-2">
      <div class="h-9 w-9 rounded-full bg-primary-600"></div>
      <div>
        <h1 id="brand" class="text-base font-semibold leading-tight">Tienda</h1>
        <a id="ig" target="_blank" class="text-xs text-neutral-500 hover:text-primary-700"></a>
      </div>
    </div>
    <button id="cart-btn" class="relative rounded-md bg-primary-600 px-3 py-2 text-sm font-medium text-white hover:bg-primary-700">
      Carrito
      <span class="ml-1 inline-flex h-5 min-w-5 items-center justify-center rounded-full bg-white px-1 text-xs font-semibold text-primary-700">
        <span id="cart-count">0</span>
      </span>
    </button>
  </div>
</header>

<main class="mx-auto max-w-6xl px-4 py-6">
  <div id="catalogo">
    <p class="text-sm text-neutral-500">Cargando catálogo…</p>
  </div>
</main>

<footer class="border-t border-neutral-200 bg-white">
  <div class="mx-auto max-w-6xl p-4 text-center text-xs text-neutral-500">
    Tienda · pedidos persistidos en Supabase
  </div>
</footer>

<!-- ===================== Drawer carrito + checkout ===================== -->
<div id="backdrop" class="fixed inset-0 z-40 hidden bg-black/40"></div>
<aside id="drawer" class="fixed right-0 top-0 z-50 flex h-full w-full max-w-md translate-x-full flex-col bg-white shadow-2xl transition-transform">
  <div class="flex items-center justify-between border-b border-neutral-200 p-4">
    <h2 class="text-lg font-semibold">Tu pedido</h2>
    <button id="close-drawer" class="text-neutral-500 hover:text-neutral-900 text-2xl leading-none">×</button>
  </div>

  <div id="cart-list" class="flex-1 overflow-y-auto p-4"></div>

  <form id="checkout-form" class="border-t border-neutral-200 p-4 space-y-3 bg-neutral-50">
    <div class="flex items-center justify-between">
      <span class="text-sm text-neutral-600">Total</span>
      <span id="cart-total" class="text-lg font-semibold text-primary-700">$0</span>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <label class="text-xs">
        <span class="text-neutral-600">Nombre *</span>
        <input name="cliente_nombre" required class="mt-1 w-full rounded border-neutral-300 text-sm focus:ring-primary-500" />
      </label>
      <label class="text-xs">
        <span class="text-neutral-600">Teléfono *</span>
        <input name="telefono" required class="mt-1 w-full rounded border-neutral-300 text-sm focus:ring-primary-500" />
      </label>
    </div>

    <label class="text-xs block">
      <span class="text-neutral-600">Método de entrega</span>
      <select name="metodo_entrega" class="mt-1 w-full rounded border-neutral-300 text-sm focus:ring-primary-500">
        <option value="">Seleccionar…</option>
        <option>Retiro en punto de encuentro</option>
        <option>Envío a domicilio</option>
      </select>
    </label>

    <label class="text-xs block">
      <span class="text-neutral-600">Dirección (si aplica)</span>
      <input name="direccion" class="mt-1 w-full rounded border-neutral-300 text-sm focus:ring-primary-500" />
    </label>

    <label class="text-xs block">
      <span class="text-neutral-600">Vendedor</span>
      <input name="vendedor" class="mt-1 w-full rounded border-neutral-300 text-sm focus:ring-primary-500" />
    </label>

    <button id="cart-finalizar" type="submit" class="w-full rounded-md bg-primary-600 py-2.5 text-sm font-semibold text-white hover:bg-primary-700">
      Finalizar por WhatsApp
    </button>
    <p class="text-[10px] text-neutral-500 text-center">
      Al finalizar, el pedido se guarda con código PER-XXXXX y luego se abre WhatsApp con el detalle.
    </p>
  </form>
</aside>

</body>
</html>
